name: 🔦 Lighthouse Performance

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/sites/**'
      - 'packages/ui/**'
      - 'packages/config/**'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  CLOUDFLARE_PROJECT_NAME: epic-startup-web
  HUSKY: 0
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Force npm to resolve linux-x64 optional native bindings even when lockfile
  # was generated on macOS. Fixes @rolldown/binding-linux-x64-gnu missing on CI.
  npm_config_os: linux
  npm_config_cpu: x64
  npm_config_libc: glibc

jobs:
  preview-deploy:
    name: 🚀 Preview Deploy
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🏗 Build Web App
        run: |
          cd apps/web
          npm run build

      - name: 🧩 Patch Wrangler config (Web preview)
        run:
          node scripts/patch-wrangler.mjs --app web --env preview
          --require-bindings
        env:
          WEB_D1_DATABASE_ID: ${{ vars.WEB_D1_DATABASE_ID }}
          WEB_R2_BUCKET_NAME: ${{ vars.WEB_R2_BUCKET_NAME }}
          WEB_WORKER_NAME_PREVIEW: epic-startup-preview
          ROOT_APP: ${{ vars.ROOT_APP }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}

      - name: 🚀 Deploy Preview to Cloudflare Workers
        id: deploy
        working-directory: apps/web
        run: |
          deploy_output=$(npx wrangler deploy --config dist/server/wrangler.deploy.json --env="")
          echo "$deploy_output"
          url=$(echo "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | head -n 1)
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📝 Comment Preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Preview Deployment

            | Environment | URL |
            |-------------|-----|
            | Preview | [${previewUrl}](${previewUrl}) |

            _Lighthouse performance audit will run automatically._`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-24.04
    needs: preview-deploy
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 📥 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: ⏳ Wait for deployment to be ready
        run: |
          echo "Waiting for preview deployment to be ready..."
          sleep 30

          # Verify the URL is accessible
          max_attempts=10
          attempt=1
          url="${{ needs.preview-deploy.outputs.preview_url }}"

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt: Checking $url"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            
            if [ "$status" = "200" ]; then
              echo "✅ Preview deployment is ready!"
              break
            fi
            
            echo "Status: $status - Waiting 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "❌ Preview deployment not ready after $max_attempts attempts"
            exit 1
          fi

      - name: 🔦 Run Lighthouse CI
        id: lighthouse
        run: |
          lhci autorun \
            --config=apps/web/lighthouserc.cjs \
            --collect.url="${{ needs.preview-deploy.outputs.preview_url }}" \
            --collect.url="${{ needs.preview-deploy.outputs.preview_url }}/about" \
            --collect.url="${{ needs.preview-deploy.outputs.preview_url }}/posts/page/1"
        env:
          # Optional: Install https://github.com/apps/lighthouse-ci for enhanced GitHub integration
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}

      - name: 📊 Upload Lighthouse Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: 📝 Comment Lighthouse Results
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read lighthouse results
            const lhciDir = '.lighthouseci';
            let results = [];

            try {
              const files = fs.readdirSync(lhciDir);
              const jsonFiles = files.filter(f => f.endsWith('.json') && f.startsWith('lhr-'));
              
              for (const file of jsonFiles) {
                const content = fs.readFileSync(path.join(lhciDir, file), 'utf8');
                const lhr = JSON.parse(content);
                results.push({
                  url: lhr.finalUrl || lhr.requestedUrl,
                  performance: Math.round(lhr.categories.performance.score * 100),
                  accessibility: Math.round(lhr.categories.accessibility.score * 100),
                  bestPractices: Math.round(lhr.categories['best-practices'].score * 100),
                  seo: Math.round(lhr.categories.seo.score * 100),
                });
              }
            } catch (e) {
              console.log('Could not read lighthouse results:', e.message);
            }

            // Calculate averages
            const avg = (arr, key) => Math.round(arr.reduce((sum, r) => sum + r[key], 0) / arr.length);

            const getScoreEmoji = (score) => {
              if (score >= 98) return '🟢';
              if (score >= 90) return '🟡';
              return '🔴';
            };

            const getStatus = (score, target = 90) => {
              if (score >= target) return 'PASS ✅';
              return 'FAIL ❌';
            };

            let body = `## 🔦 Lighthouse Performance Report

            | Metric | Score | Status |
            |--------|-------|--------|`;

            if (results.length > 0) {
              const perfAvg = avg(results, 'performance');
              const a11yAvg = avg(results, 'accessibility');
              const bpAvg = avg(results, 'bestPractices');
              const seoAvg = avg(results, 'seo');
              
              body += `
            | ${getScoreEmoji(perfAvg)} Performance | **${perfAvg}** | ${getStatus(perfAvg, 85)} |
            | ${getScoreEmoji(a11yAvg)} Accessibility | **${a11yAvg}** | ${getStatus(a11yAvg, 90)} |
            | ${getScoreEmoji(bpAvg)} Best Practices | **${bpAvg}** | ${getStatus(bpAvg, 90)} |
            | ${getScoreEmoji(seoAvg)} SEO | **${seoAvg}** | ${getStatus(seoAvg, 90)} |

            ### 📋 Detailed Results

            | Page | Performance | Accessibility | Best Practices | SEO |
            |------|-------------|---------------|----------------|-----|`;
              
              for (const r of results) {
                const pagePath = new URL(r.url).pathname || '/';
                body += `
            | \`${pagePath}\` | ${getScoreEmoji(r.performance)} ${r.performance} | ${getScoreEmoji(r.accessibility)} ${r.accessibility} | ${getScoreEmoji(r.bestPractices)} ${r.bestPractices} | ${getScoreEmoji(r.seo)} ${r.seo} |`;
              }
              
              body += `

            ---
            🎯 **Target:** Performance ≥ 85, Accessibility/Best Practices/SEO ≥ 90
            📊 **Runs:** 3 per page (median reported)
            🔗 **Preview:** ${{ needs.preview-deploy.outputs.preview_url }}`;
              
              // Check if any score is below threshold
              const allPassing = perfAvg >= 85 && a11yAvg >= 90 && bpAvg >= 90 && seoAvg >= 90;
              
              if (!allPassing) {
                body += `

            ⚠️ **Performance budget exceeded!** Please optimize before merging.`;
              }
            } else {
              body += `

            ❌ Could not retrieve Lighthouse results. Check the workflow logs.`;
            }

            // Find and update existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Lighthouse Performance Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  performance-gate:
    name: 🚦 Performance Gate
    runs-on: ubuntu-24.04
    needs: [preview-deploy, lighthouse]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 📥 Download Lighthouse Report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lighthouse-report
          path: .lighthouseci/

      - name: 🚦 Check Performance Budget
        run: |
          echo "Checking performance scores against budget..."
          node <<'EOF'
          const fs = require('node:fs')
          const path = require('node:path')

          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b)
            const mid = Math.floor(sorted.length / 2)
            return sorted.length % 2 === 0
              ? Math.round((sorted[mid - 1] + sorted[mid]) / 2)
              : sorted[mid]
          }

          const byUrl = new Map()
          for (const file of fs.readdirSync('.lighthouseci')) {
            if (!file.startsWith('lhr-') || !file.endsWith('.json')) continue
            const lhr = JSON.parse(
              fs.readFileSync(path.join('.lighthouseci', file), 'utf8'),
            )
            const url = lhr.finalUrl || lhr.requestedUrl
            const entry = byUrl.get(url) ?? {
              performance: [],
              accessibility: [],
              bestPractices: [],
              seo: [],
            }
            entry.performance.push(Math.round(lhr.categories.performance.score * 100))
            entry.accessibility.push(
              Math.round(lhr.categories.accessibility.score * 100),
            )
            entry.bestPractices.push(
              Math.round(lhr.categories['best-practices'].score * 100),
            )
            entry.seo.push(Math.round(lhr.categories.seo.score * 100))
            byUrl.set(url, entry)
          }

          const perfThreshold = 85
          const threshold = 90
          let failed = false

          for (const [url, scores] of byUrl.entries()) {
            const perf = median(scores.performance)
            const a11y = median(scores.accessibility)
            const bp = median(scores.bestPractices)
            const seo = median(scores.seo)

            console.log('URL:', url)
            console.log('Performance (median):', perf)
            console.log('Accessibility (median):', a11y)
            console.log('Best Practices (median):', bp)
            console.log('SEO (median):', seo)

            if (perf < perfThreshold) {
              console.error(
                `❌ Performance score ${perf} is below threshold ${perfThreshold}`,
              )
              failed = true
            }
            if (a11y < threshold) {
              console.error(
                `❌ Accessibility score ${a11y} is below threshold ${threshold}`,
              )
              failed = true
            }
            if (bp < threshold) {
              console.error(
                `❌ Best Practices score ${bp} is below threshold ${threshold}`,
              )
              failed = true
            }
            if (seo < threshold) {
              console.error(`❌ SEO score ${seo} is below threshold ${threshold}`)
              failed = true
            }
          }

          if (failed) process.exit(1)
          console.log('✅ All pages pass performance budget!')
          EOF
