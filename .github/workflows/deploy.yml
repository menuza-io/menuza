name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write

env:
  HUSKY: 0
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  TURBO_R2_BUCKET: epic-startup-turbo-cache
  # Force npm to resolve linux-x64 optional native bindings even when lockfile
  # was generated on macOS. Fixes @libsql/linux-x64-gnu and similar missing modules.
  npm_config_os: linux
  npm_config_cpu: x64
  npm_config_libc: glibc

jobs:
  affected:
    name: 📊 Detect Affected Projects
    runs-on: ubuntu-22.04
    outputs:
      app: ${{ steps.affected.outputs.app }}
      admin: ${{ steps.affected.outputs.admin }}
      web: ${{ steps.affected.outputs.web }}
      sites: ${{ steps.affected.outputs.sites }}
      tenant_api: ${{ steps.affected.outputs.tenant_api }}
      jobs_cron: ${{ steps.affected.outputs.jobs_cron }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 📊 Check affected projects
        id: affected
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          # Turbo's JSON output is an API contract; formatted terminal output is not.
          affected_packages=$(npx turbo ls --filter="...[$BASE_REF]" --output=json)
          is_affected() {
            echo "$affected_packages" | jq -e --arg package "$1" \
              '.packages.items | any(.name == $package)' > /dev/null
          }

          for package in app admin web sites tenant-api jobs-cron; do
            if is_affected "$package"; then
              value=true
            else
              value=false
            fi
            output_name=${package//-/_}
            echo "$output_name=$value" >> "$GITHUB_OUTPUT"
          done
  lint:
    name: 🔬 Lint
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Lint (Oxc - Fast)
        run: npm run lint:oxc

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Set up Turbo remote cache
        if: >
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        continue-on-error: true
        uses: rharkor/caching-for-turbo@69aec4f8e0792a339e9181bc38e07f4990ded015 # v2.3.12
        with:
          provider: s3
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          s3-bucket: ${{ env.TURBO_R2_BUCKET }}
          s3-region: auto
          s3-endpoint:
            https://${{ secrets.CLOUDFLARE_ACCOUNT_ID
            }}.r2.cloudflarestorage.com
          s3-prefix: turbo/
          max-age: 30d

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: 🔐 Write CI app env files
        run: node scripts/write-ci-app-env.mjs
        env:
          SESSION_SECRET: test-session-secret-for-tests-only-min-32-chars
          HONEYPOT_SECRET: test-honeypot-secret-for-tests-only
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          INTEGRATIONS_OAUTH_STATE_SECRET: test-oauth-state-secret-32-chars
          TRUST_PROXY: true

      - name: 🏗 Build
        run: npm run build

      - name: 🔎 Type check
        run: npm run typecheck --if-present

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Set up Turbo remote cache
        if: >
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        continue-on-error: true
        uses: rharkor/caching-for-turbo@69aec4f8e0792a339e9181bc38e07f4990ded015 # v2.3.12
        with:
          provider: s3
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          s3-bucket: ${{ env.TURBO_R2_BUCKET }}
          s3-region: auto
          s3-endpoint:
            https://${{ secrets.CLOUDFLARE_ACCOUNT_ID
            }}.r2.cloudflarestorage.com
          s3-prefix: turbo/
          max-age: 30d

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Run vitest
        run: npm run test -- -- --coverage
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-for-tests-only-min-32-chars
          HONEYPOT_SECRET: test-honeypot-secret-for-tests-only
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          INTEGRATIONS_OAUTH_STATE_SECRET: test-oauth-state-secret-32-chars
          TRUST_PROXY: true

  playwright:
    name: 🎭 Playwright
    needs: [affected]
    if: |
      (needs.affected.outputs.app == 'true' || needs.affected.outputs.admin == 'true') &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'dev') ||
        (github.event_name == 'push' && github.ref != 'refs/heads/dev')
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Set up Turbo remote cache
        if: >
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        continue-on-error: true
        uses: rharkor/caching-for-turbo@69aec4f8e0792a339e9181bc38e07f4990ded015 # v2.3.12
        with:
          provider: s3
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          s3-bucket: ${{ env.TURBO_R2_BUCKET }}
          s3-region: auto
          s3-endpoint:
            https://${{ secrets.CLOUDFLARE_ACCOUNT_ID
            }}.r2.cloudflarestorage.com
          s3-prefix: turbo/
          max-age: 30d

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 📥 Install Playwright Browsers
        run: |
          for attempt in 1 2 3; do
            if npm run test:e2e:install; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1

      - name: 🛠 Setup Database
        run: |
          npm run db:migrate:deploy && npm run db:generate && npm run db:seed

      - name: 🔐 Write CI app env files
        run: node scripts/write-ci-app-env.mjs
        env:
          SESSION_SECRET: test-session-secret-for-tests-only-min-32-chars
          HONEYPOT_SECRET: test-honeypot-secret-for-tests-only
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          INTEGRATIONS_OAUTH_STATE_SECRET: test-oauth-state-secret-32-chars
          TRUST_PROXY: true

      - name: 🏗 Build affected apps
        run: |
          FILTERS=()
          if [ "${{ needs.affected.outputs.app }}" = "true" ]; then FILTERS+=(--filter=app); fi
          if [ "${{ needs.affected.outputs.admin }}" = "true" ]; then FILTERS+=(--filter=admin); fi
          npx turbo run build "${FILTERS[@]}"

      - name: 🎭 Playwright tests
        run: |
          FILTERS=()
          if [ "${{ needs.affected.outputs.app }}" = "true" ]; then FILTERS+=(--filter=app); fi
          if [ "${{ needs.affected.outputs.admin }}" = "true" ]; then FILTERS+=(--filter=admin); fi
          npx turbo run test:e2e:run "${FILTERS[@]}" --concurrency=1 --log-order=stream

      - name: 📊 Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/app/playwright-report/
            apps/admin/playwright-report/
          retention-days: 30

  migrate-control-plane-d1:
    name: 🗃️ Migrate Control-Plane D1
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright]
    if: |
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.vitest.result == 'success' &&
      (needs.playwright.result == 'success' || needs.playwright.result == 'skipped')
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🗃️ Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_D1_DATABASE_ID: ${{ vars.APP_D1_DATABASE_ID }}
          APP_D1_DATABASE_ID_STAGING: ${{ vars.APP_D1_DATABASE_ID_STAGING }}
          APP_KV_NAMESPACE_ID: ${{ vars.APP_KV_NAMESPACE_ID }}
          APP_KV_NAMESPACE_ID_STAGING: ${{ vars.APP_KV_NAMESPACE_ID_STAGING }}
          APP_SITES_DATA_KV_ID: ${{ vars.APP_SITES_DATA_KV_ID }}
          APP_SITES_DATA_KV_ID_STAGING: ${{ vars.APP_SITES_DATA_KV_ID_STAGING }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            DEPLOY_ENV=staging
            WRANGLER_ENV=(--env staging)
          else
            DEPLOY_ENV=production
            WRANGLER_ENV=()
          fi

          node scripts/patch-wrangler.mjs --app app --env "$DEPLOY_ENV" --require-bindings
          npx wrangler d1 migrations apply epic-startup-db --remote \
            --config apps/app/wrangler.deploy.jsonc "${WRANGLER_ENV[@]}"

  trigger-cf-deploys:
    name: ☁️ Trigger Cloudflare Deploys
    runs-on: ubuntu-24.04
    needs:
      [lint, typecheck, vitest, playwright, affected, migrate-control-plane-d1]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.vitest.result == 'success' &&
      needs.affected.result == 'success' &&
      needs.migrate-control-plane-d1.result == 'success' &&
      (needs.playwright.result == 'success' || needs.playwright.result == 'skipped')
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ☁️ Trigger Workers Builds
        env:
          DEPLOY_TIER:
            ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
          GITHUB_SHA: ${{ github.sha }}
          CLOUDFLARE_BUILDS_API_TOKEN:
            ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AFFECTED_APP:
            ${{ needs.affected.outputs.app == 'true' && 'true' || 'false' }}
          AFFECTED_ADMIN:
            ${{ needs.affected.outputs.admin == 'true' && 'true' || 'false' }}
          AFFECTED_WEB:
            ${{ needs.affected.outputs.web == 'true' && 'true' || 'false' }}
          AFFECTED_SITES:
            ${{ needs.affected.outputs.sites == 'true' && 'true' || 'false' }}
          AFFECTED_JOBS_CRON:
            ${{ needs.affected.outputs.jobs_cron == 'true' && 'true' || 'false'
            }}
          AFFECTED_TENANT_API:
            ${{ needs.affected.outputs.tenant_api == 'true' && 'true' || 'false'
            }}
          CF_BUILD_TRIGGER_APP_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_APP_PRODUCTION }}
          CF_BUILD_TRIGGER_APP_STAGING: ${{ vars.CF_BUILD_TRIGGER_APP_STAGING }}
          CF_BUILD_TRIGGER_ADMIN_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_ADMIN_PRODUCTION }}
          CF_BUILD_TRIGGER_ADMIN_STAGING:
            ${{ vars.CF_BUILD_TRIGGER_ADMIN_STAGING }}
          CF_BUILD_TRIGGER_WEB_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_WEB_PRODUCTION }}
          CF_BUILD_TRIGGER_WEB_STAGING: ${{ vars.CF_BUILD_TRIGGER_WEB_STAGING }}
          CF_BUILD_TRIGGER_SITES_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_SITES_PRODUCTION }}
          CF_BUILD_TRIGGER_SITES_STAGING:
            ${{ vars.CF_BUILD_TRIGGER_SITES_STAGING }}
          CF_BUILD_TRIGGER_JOBS_CRON_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_JOBS_CRON_PRODUCTION }}
          CF_BUILD_TRIGGER_JOBS_CRON_STAGING:
            ${{ vars.CF_BUILD_TRIGGER_JOBS_CRON_STAGING }}
          CF_BUILD_TRIGGER_TENANT_API_PRODUCTION:
            ${{ vars.CF_BUILD_TRIGGER_TENANT_API_PRODUCTION }}
          CF_BUILD_TRIGGER_TENANT_API_STAGING:
            ${{ vars.CF_BUILD_TRIGGER_TENANT_API_STAGING }}
        run: node scripts/trigger-cf-builds.mjs

  # CMS is deployed to Cloudflare Workers (no container needed)

  container-tenant-api:
    name: 📦 Build Tenant API Image
    runs-on: ubuntu-24.04
    needs: [affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.tenant_api ==
      'true' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 🏷️ Image name
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/tenant-api" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and push linux/arm64 (OCI Ampere)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/tenant-api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}

  deploy-tenant-api-oci:
    name: 🚀 Deploy Tenant API (OCI)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container-tenant-api, affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.tenant_api ==
      'true' }}
    steps:
      - name: 🚀 Deploy US (Ashburn, optional OCI fallback)
        if: ${{ vars.OCI_TENANT_US_HOST != '' }}
        env:
          HOST: ${{ vars.OCI_TENANT_US_HOST }}
          SSH_USER: ${{ vars.OCI_TENANT_SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.OCI_TENANT_SSH_KEY }}
          IMAGE:
            ${{ needs.container-tenant-api.outputs.image }}:${{ github.sha }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oci_key
          printf '%s\n' "$SSH_KEY" > /tmp/oci_key
          ssh -i /tmp/oci_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail
             echo '${PULL_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             cd /opt/tenant-api
             TENANT_API_IMAGE='${IMAGE}' docker compose pull
             TENANT_API_IMAGE='${IMAGE}' docker compose up -d"

      - name: 🚀 Deploy KSA (Riyadh)
        if: false # Disabled: deployment to KSA delayed (${{ vars.OCI_TENANT_KSA_HOST != '' }})
        env:
          HOST: ${{ vars.OCI_TENANT_KSA_HOST }}
          SSH_USER: ${{ vars.OCI_TENANT_SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.OCI_TENANT_SSH_KEY }}
          IMAGE:
            ${{ needs.container-tenant-api.outputs.image }}:${{ github.sha }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oci_key
          printf '%s\n' "$SSH_KEY" > /tmp/oci_key
          ssh -i /tmp/oci_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail
             echo '${PULL_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             cd /opt/tenant-api
             TENANT_API_IMAGE='${IMAGE}' docker compose pull
             TENANT_API_IMAGE='${IMAGE}' docker compose up -d"

      - name: 🩺 Health check KSA (OCI)
        if: false # Disabled: deployment to KSA delayed (${{ vars.TENANT_API_URL_KSA != '' }})
        env:
          TENANT_API_URL_KSA: ${{ vars.TENANT_API_URL_KSA }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "${TENANT_API_URL_KSA}/health" || true)"
            if echo "$body" | grep -q '"region":"ksa"'; then
              echo "KSA tenant-api healthy on OCI"
              exit 0
            fi
            echo "Attempt ${attempt}/5: waiting for KSA tenant-api..."
            sleep 15
          done
          echo "KSA tenant-api health check failed"
          exit 1
