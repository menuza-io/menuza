# The app is framework-only: no AndroidX, no Jetifier. Flipping this to `true`
# would only be needed when a dependency pulls AndroidX in — and that dependency
# would have to justify its bytes (see README.md "Size budget").
android.useAndroidX=false

# Non-transitive R classes: each module only gets its own resources.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
