auto_review:
  enabled: true
  base_branches:
    - "main"
    - "dev"
  target_branches:
    - "main"
    - "dev"
  review_types:
    - "code_review"
    - "code_review_with_changes"
    - "code_review_with_changes_and_comments"
    - "code_review_with_changes_and_comments_and_suggestions"
    - "code_review_with_changes_and_comments_and_suggestions_and_suggestions"