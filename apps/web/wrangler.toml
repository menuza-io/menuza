name = "menuza"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Patched at deploy by scripts/patch-wrangler.mjs
[vars]
PUBLIC_ROOT_APP = "menuza.io"
PUBLIC_APP_URL = "https://app.menuza.io"
PUBLIC_POSTHOG_PROJECT_TOKEN = ""
PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"
PUBLIC_POSTHOG_RELEASE = ""

[[d1_databases]]
binding = "DB"
database_name = "menuza-web-db"
database_id = "00000000-0000-0000-0000-000000000002"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "menuza-media"

[env.production]
name = "menuza"

[env.preview]
name = "menuza-preview"

[env.staging]
name = "menuza-staging"
